# .claude/denetim.conf — hangi dosya değişince hangi denetim koşar.
# Komutlar proje kökünde `bash -c` ile koşar; çıkış kodu 0 = geçti.

[ts-tipler]
desen = src/* tsconfig*.json package.json vite.config.ts
hizli = export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; npx tsc --noEmit
tam   = export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; npm run build

[testler]
desen = src/*
hizli = export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; npx vitest related --run {dosyalar}
tam   = export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; npm test

[rust]
desen = src-tauri/src/* src-tauri/migrations/* src-tauri/Cargo.toml
hizli = . "$HOME/.cargo/env"; cd src-tauri && cargo check --quiet
